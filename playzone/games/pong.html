<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong - PlayZone</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:600 15px/1.4 system-ui,sans-serif;color:#203743}body{display:grid;place-items:center;padding:12px;background:linear-gradient(145deg,#e2f7f1,#fff3df)}main{width:min(100%,680px);padding:14px;border:1px solid #cce3df;border-radius:15px;background:#ffffffed;box-shadow:0 14px 34px #17414b20}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;color:#127e79;font-size:2rem}#score{font-size:1.2rem;font-weight:900;color:#127e79}.help{margin:5px 0 10px;color:#61717a;font-size:.86rem}canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;border-radius:10px;background:#163c4a;touch-action:none}.controls{display:flex;justify-content:center;gap:12px;margin-top:10px}.controls button,#restart{min-width:62px;min-height:40px;border:0;border-radius:8px;background:#127e79;color:white;font-size:1.2rem;font-weight:900;cursor:pointer;touch-action:none}#restart{padding:7px 14px;font-size:.95rem}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}#status{min-height:1.4em;color:#127e79;font-weight:800}button:focus-visible{outline:3px solid #e49e36;outline-offset:2px}
</style></head><body><main>
<header><h1>Pong</h1><output id="score" aria-live="polite">0 : 0</output></header>
<p class="help">First to 5 wins. Move with ↑/↓ or W/S; on touch, hold the buttons below.</p>
<canvas id="court" width="600" height="400" aria-label="Pong court"></canvas>
<div class="controls"><button id="up" aria-label="Move paddle up">↑</button><button id="down" aria-label="Move paddle down">↓</button></div>
<div class="actions"><span id="status" aria-live="polite">Ready</span><button id="restart" type="button">Restart</button></div>
</main><script>
const canvas=document.getElementById("court"),context=canvas.getContext("2d"),scoreNode=document.getElementById("score"),statusNode=document.getElementById("status");
let player=0,cpu=0,paddleY=160,ball={x:300,y:200,vx:4,vy:2.5},keys={up:false,down:false},running=true,lastTime=0;
function resetBall(direction){ball={x:300,y:200,vx:4*direction,vy:(Math.random()-.5)*4}}
function draw(){context.clearRect(0,0,600,400);context.fillStyle="#163c4a";context.fillRect(0,0,600,400);context.fillStyle="#bcebd5";for(let y=8;y<400;y+=24)context.fillRect(298,y,4,12);context.fillRect(22,paddleY,12,80);context.fillRect(566,cpuY,12,80);context.beginPath();context.arc(ball.x,ball.y,8,0,Math.PI*2);context.fillStyle="#ffd166";context.fill();scoreNode.textContent=`${player} : ${cpu}`}
let cpuY=160;
function finish(){running=false;statusNode.textContent=player>=5?"You win! Restart for another match.":"CPU wins. Restart for a rematch.";parent.postMessage({type:"score",score:player},"*")}
function frame(timestamp){const elapsed=Math.min((timestamp-lastTime)/16.67||1,2);lastTime=timestamp;if(running){if(keys.up)paddleY=Math.max(0,paddleY-5*elapsed);if(keys.down)paddleY=Math.min(320,paddleY+5*elapsed);cpuY+=Math.max(-3,Math.min(3,ball.y-40-cpuY))*elapsed;ball.x+=ball.vx*elapsed;ball.y+=ball.vy*elapsed;if(ball.y<8||ball.y>392)ball.vy*=-1;if(ball.x<34&&ball.y>=paddleY-5&&ball.y<=paddleY+85){ball.vx=Math.abs(ball.vx)*1.04;ball.vy+=((ball.y-paddleY-40)/18)}if(ball.x>558&&ball.y>=cpuY-5&&ball.y<=cpuY+85)ball.vx=-Math.abs(ball.vx)*1.03;if(ball.x<0){cpu++;resetBall(1)}if(ball.x>600){player++;resetBall(-1)}if(player>=5||cpu>=5)finish()}draw();requestAnimationFrame(frame)}
window.addEventListener("keydown",event=>{if(["ArrowUp","ArrowDown","w","s","W","S"].includes(event.key))event.preventDefault();if(event.key==="ArrowUp"||event.key.toLowerCase()==="w")keys.up=true;if(event.key==="ArrowDown"||event.key.toLowerCase()==="s")keys.down=true});
window.addEventListener("keyup",event=>{if(event.key==="ArrowUp"||event.key.toLowerCase()==="w")keys.up=false;if(event.key==="ArrowDown"||event.key.toLowerCase()==="s")keys.down=false});
function hold(button,direction){button.addEventListener("pointerdown",event=>{event.preventDefault();keys[direction]=true;button.setPointerCapture(event.pointerId)});for(const name of ["pointerup","pointercancel","lostpointercapture"])button.addEventListener(name,()=>keys[direction]=false)}
hold(document.getElementById("up"),"up");hold(document.getElementById("down"),"down");
document.getElementById("restart").addEventListener("click",()=>{player=0;cpu=0;paddleY=160;cpuY=160;running=true;statusNode.textContent="Match on!";resetBall(Math.random()<.5?1:-1)});requestAnimationFrame(frame);
</script></body></html>
