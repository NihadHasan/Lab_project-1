<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic-Tac-Toe - PlayZone</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:600 16px/1.45 system-ui,sans-serif;color:#262d49}body{display:grid;place-items:center;padding:16px;background:linear-gradient(145deg,#e8e9ff,#fff4e6)}main{width:min(100%,420px);padding:20px;border:1px solid #d9daf0;border-radius:16px;background:#ffffffed;box-shadow:0 14px 34px #28284d1c}header{display:flex;align-items:center;justify-content:space-between}h1{margin:0;color:#5d58b7;font-size:2rem}#score{padding:7px 11px;border-radius:9px;background:#eeedff;color:#514caa}.help{margin:7px 0 16px;color:#656985;font-size:.9rem}#status{min-height:1.6em;margin:0 0 10px;text-align:center;font-weight:800;color:#514caa}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(100%,330px);margin:0 auto}.cell{aspect-ratio:1;border:1px solid #dddcf4;border-radius:12px;background:#f6f5ff;color:#514caa;font-size:clamp(2.7rem,16vw,5rem);font-weight:900;cursor:pointer}.cell[data-mark="O"]{color:#dc8140}.cell:disabled{cursor:default}.cell:focus-visible,button:focus-visible{outline:3px solid #e5a53b;outline-offset:2px}.actions{display:flex;justify-content:center;margin-top:14px}button.restart{min-height:42px;padding:8px 18px;border:0;border-radius:9px;background:#5d58b7;color:white;font:800 1rem system-ui;cursor:pointer}
</style></head><body><main>
<header><h1>Tic-Tac-Toe</h1><output id="score" aria-live="polite">Wins 0</output></header>
<p class="help">Two players take turns on the same board. Get three marks in a row, column, or diagonal. A win scores 100; a draw scores 10.</p>
<p id="status" aria-live="polite">X goes first</p>
<div class="board" id="board" role="group" aria-label="Tic-Tac-Toe board"></div>
<div class="actions"><button class="restart" id="restart" type="button">Restart</button></div>
</main><script>
const boardNode=document.getElementById("board"),statusNode=document.getElementById("status"),scoreNode=document.getElementById("score"),wins={X:0,O:0};
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let cells,turn,ended;
function draw(){boardNode.replaceChildren();cells.forEach((mark,index)=>{const button=document.createElement("button");button.className="cell";button.type="button";button.textContent=mark;button.disabled=Boolean(mark)||ended;button.setAttribute("aria-label",`Cell ${index+1}${mark?`, ${mark}`:""}`);if(mark)button.dataset.mark=mark;button.addEventListener("click",()=>play(index));boardNode.append(button)});scoreNode.textContent=`Wins ${wins.X+ wins.O}`}
function start(){cells=Array(9).fill("");turn="X";ended=false;statusNode.textContent="X goes first";draw()}
function play(index){if(ended||cells[index])return;cells[index]=turn;const winner=lines.some(line=>line.every(position=>cells[position]===turn));if(winner){ended=true;wins[turn]++;statusNode.textContent=`${turn} wins! Restart for another round.`;parent.postMessage({type:"score",score:100},"*")}else if(cells.every(Boolean)){ended=true;statusNode.textContent="It's a draw. Restart for another round.";parent.postMessage({type:"score",score:10},"*")}else{turn=turn==="X"?"O":"X";statusNode.textContent=`${turn}'s turn`}draw()}
document.getElementById("restart").addEventListener("click",start);start();
</script></body></html>
