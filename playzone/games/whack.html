<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#7c2d12;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;color:#fff;user-select:none}
#g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(90vw,60vh,360px)}
.h{aspect-ratio:1;border:0;border-radius:50%;background:#431407;font-size:clamp(2rem,10vw,3.4rem);cursor:pointer}
#i{font-weight:700;margin-bottom:12px}button.r{margin-top:14px;padding:8px 22px;border:0;border-radius:99px;font-weight:700;cursor:pointer}</style></head>
<body><div id="i">Press Start</div><div id="g"></div><button class="r" id="b" onclick="start()">Start</button>
<script>
let score=0,time=0,up=-1,tm,mv;const H=[];
for(let i=0;i<9;i++){const h=document.createElement("button");h.className="h";h.onclick=()=>{if(i===up&&time>0){score++;up=-1;draw();info()}};g.appendChild(h);H.push(h)}
function draw(){H.forEach((h,i)=>h.textContent=i===up?"🐹":"")}
function info(){i.textContent="Time: "+time+"  Score: "+score}
function start(){clearInterval(tm);clearInterval(mv);score=0;time=30;b.textContent="Restart";info();
 mv=setInterval(()=>{up=Math.random()*9|0;draw()},700);
 tm=setInterval(()=>{time--;info();if(time<=0){clearInterval(tm);clearInterval(mv);up=-1;draw();i.textContent="Time's up! Score: "+score;parent.postMessage({type:"score",score},"*")}},1000)}
</script></body></html>
