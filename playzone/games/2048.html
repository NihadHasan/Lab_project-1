<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2048 - PlayZone</title>
<style>
:root{color-scheme:light;--ink:#203632;--green:#147d72;--paper:#f2f8f4;--tile:#dce9e1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:600 16px/1.4 system-ui,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:14px;background:linear-gradient(145deg,#e1f5e9,#f7f3df)}main{width:min(100%,430px);padding:16px;border:1px solid #cfdfd5;border-radius:16px;background:#ffffffed;box-shadow:0 14px 34px #153d2b20}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;color:var(--green);font-size:2rem}#score{padding:7px 12px;border-radius:9px;background:#e5f3ea;font-weight:800}.help{margin:8px 0 14px;color:#597069;font-size:.88rem}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;border-radius:12px;background:#bfd3c6;touch-action:none}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:var(--tile);font-size:clamp(1.2rem,7vw,2rem);font-weight:900;color:#31554a}.tile[data-value="2"]{background:#f5f4e7}.tile[data-value="4"]{background:#d6eee1}.tile[data-value="8"]{background:#84cdb2;color:white}.tile[data-value="16"]{background:#49ad93;color:white}.tile[data-value="32"]{background:#388f89;color:white}.tile[data-value="64"]{background:#27766f;color:white}.tile[data-high="true"]{background:#5d6bc3;color:white}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}button{min-height:42px;padding:8px 16px;border:0;border-radius:9px;background:var(--green);color:white;font:800 1rem system-ui;cursor:pointer}button:focus-visible{outline:3px solid #e8a63d;outline-offset:2px}#status{min-height:1.4em;color:var(--green);font-weight:800}@media(max-width:380px){main{padding:11px}.board{gap:5px;padding:5px}}
</style></head><body><main>
<header><h1>2048</h1><output id="score" aria-live="polite">Score 0</output></header>
<p class="help">Slide matching tiles together to reach 2048. Use arrow keys or swipe the board. Your best run score is submitted when the board ends.</p>
<div class="board" id="board" role="grid" aria-label="2048 game board"></div>
<div class="actions"><span id="status" aria-live="polite">Keep merging!</span><button id="restart" type="button">Restart</button></div>
</main><script>
const boardNode=document.getElementById("board"),scoreNode=document.getElementById("score"),statusNode=document.getElementById("status");
let cells,score,finished,touchStart;
function start(){cells=Array(16).fill(0);score=0;finished=false;statusNode.textContent="Keep merging!";addTile();addTile();draw()}
function addTile(){const empty=cells.map((value,index)=>value? -1:index).filter(index=>index>=0);if(empty.length)cells[empty[Math.random()*empty.length|0]]=Math.random()<.9?2:4}
function draw(){boardNode.replaceChildren();cells.forEach(value=>{const tile=document.createElement("div");tile.className="tile";tile.setAttribute("role","gridcell");tile.setAttribute("aria-label",value?String(value):"empty");tile.textContent=value||"";if(value)tile.dataset.value=value;if(value>64)tile.dataset.high="true";boardNode.append(tile)});scoreNode.textContent=`Score ${score}`}
function slide(line){const filled=line.filter(Boolean),merged=[];let gained=0;for(let i=0;i<filled.length;i++){if(filled[i]===filled[i+1]){const value=filled[i]*2;merged.push(value);gained+=value;i++}else merged.push(filled[i])}return{line:[...merged,...Array(4-merged.length).fill(0)],gained}}
function move(direction){if(finished)return;const before=cells.join(",");let gained=0;for(let lineIndex=0;lineIndex<4;lineIndex++){const positions=Array.from({length:4},(_,offset)=>direction==="left"?lineIndex*4+offset:direction==="right"?lineIndex*4+3-offset:direction==="up"?offset*4+lineIndex:(3-offset)*4+lineIndex);const result=slide(positions.map(index=>cells[index]));gained+=result.gained;positions.forEach((index,offset)=>cells[index]=result.line[offset])}if(before===cells.join(","))return;score+=gained;addTile();draw();if(cells.includes(2048)){finished=true;statusNode.textContent="2048! You reached the tile.";parent.postMessage({type:"score",score},"*")}else if(!canMove()){finished=true;statusNode.textContent="No moves left. Restart for another run.";parent.postMessage({type:"score",score},"*")}}
function canMove(){return cells.some(value=>!value)||cells.some((value,index)=>index%4<3&&value===cells[index+1])||cells.some((value,index)=>index<12&&value===cells[index+4])}
window.addEventListener("keydown",event=>{const directions={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};if(directions[event.key]){event.preventDefault();move(directions[event.key])}});
boardNode.addEventListener("touchstart",event=>{touchStart={x:event.changedTouches[0].clientX,y:event.changedTouches[0].clientY}},{passive:true});
boardNode.addEventListener("touchend",event=>{if(!touchStart)return;const dx=event.changedTouches[0].clientX-touchStart.x,dy=event.changedTouches[0].clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24)move(Math.abs(dx)>Math.abs(dy)?dx>0?"right":"left":dy>0?"down":"up");touchStart=null},{passive:true});
document.getElementById("restart").addEventListener("click",start);start();
</script></body></html>
