<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin login - PlayZone</title><link rel="stylesheet" href="/css/style.css">
</head><body>
<main class="admin-shell">
  <a class="logo" href="/">🎮 PlayZone</a>
  <section class="admin-panel">
    <h1>Administrator login</h1>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('admin_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username<input name="username" required maxlength="80" autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </section>
</main>
</body></html>
